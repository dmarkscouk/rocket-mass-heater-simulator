name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The simulator file is a page body (the Claude artifact host adds the document shell),
      # so wrap it in a full HTML document for Pages.
      - name: Build index.html
        run: |
          mkdir -p _site
          {
            cat .github/pages/head.html
            cat rocket-mass-heater-simulator.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
